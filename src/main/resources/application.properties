# Application Configuration
spring.application.name=selenium-automation-framework

# Web Driver Configuration
browser=chrome
headless=false
implicit.wait=10
page.load.timeout=30

# Application URL
app.url=https://parabank.parasoft.com/parabank/index.htm

# Test Data
test.username=john
test.password=demo

# Logging Configuration (configured in logback.xml)
logging.level.root=INFO
logging.level.com.automation=DEBUG
logging.level.org.openqa.selenium=WARN
logging.level.org.openqa.selenium.devtools=ERROR
logging.level.org.springframework=INFO

# Screenshot Configuration
screenshot.on.failure=true
screenshot.directory=reports/screenshots/

# Report Configuration
extent.report.path=reports/extent-reports/
extent.report.name=ParaBankAutomationReport.html